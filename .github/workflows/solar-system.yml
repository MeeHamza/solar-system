name: Solar System Workflow

on: 
  workflow_dispatch:
  push:
    branches:
      - main
      - 'feature/*'
env:
  # MONGO_URI: 'mongodb+srv://supercluster.d83jj.mongodb.net/superData'
  MONGO_URI: 'mongodb+srv://superuser:SuperPassword@supercluster.d83jj.mongodb.net/superData'
  # MONGO_USERNAME: superuser
  # MONGO_PASSWORD: ${{secrets.MONGO_PASSWORD}}
  
jobs:
    unit-testing:
        name: Unit Testing
        strategy:
          matrix:
            operiting_system: [ubuntu-latest, macos-latest]
            nodejs_version: [18, 19, 20]
            exclude: 
              - operiting_system: macos-latest
                nodejs_version: 18
        runs-on: ${{matrix.operiting_system}}
        steps:
        - name: Checkout Repository
          uses: actions/checkout@v4

        - name: Setup NodeJS Version
          uses: actions/setup-node@v3
          with:
            node-version: ${{matrix.nodejs_version}}
    
        - name: Install Dependencies
          run: npm install
    
        - name: Unit Testing
          run: npm test
          
        - name: Archive Test Result
          uses: actions/upload-artifact@v4
          with:
            name: Mocha-Test-Result
            path: test-results.xml

    code-coverage:
      name: code coverage
      runs-on: ubuntu-latest
      steps:
        - name: Checkout Repository
          uses: actions/checkout@v4

        - name: Setup NodeJS Version
          uses: actions/setup-node@v3
          with:
            node-version: 18

        - name: install dependecy
          run: npm install 


        - name: check code coverage
          continue-on-error: true
          run: npm run coverage
        
        - name: archive test result
          uses: actions/upload-artifact@v4 
          with:
            name: code-coverage-result
            path: coverage
            retention-days: 5